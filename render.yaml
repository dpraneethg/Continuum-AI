# Render Blueprint — Continuum API backend
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: continuum-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/render-start.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://continuum-ai-six.vercel.app
      - key: FRONTEND_URL
        value: https://continuum-ai-six.vercel.app
      - key: ENABLE_OUTBOX_WORKER
        value: "true"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: DATABASE_FILE
        value: ./data/continuum.sqlite
